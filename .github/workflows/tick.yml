# Wakes the coach every 10 minutes so reminders, check-ins and follow-ups
# reach Telegram even when no device has the app open. (GitHub may delay a
# run by a few minutes; the open app also wakes it every 2 minutes.)
name: Coach tick
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Three tries, then the run fails (it used to always "pass"): GitHub emails
      # you about a failed scheduled run, so you hear about it even when Ben's
      # server is down and can't message you itself.
      - name: Wake the coach
        run: |
          for i in 1 2 3; do
            curl -fsS -m 60 "https://mega-system-ten.vercel.app/api/cron?job=tick" && exit 0
            sleep 20
          done
          echo "::error::Ben's server did not answer 3 times in a row"
          exit 1
