# Checks every push and pull request: types, unit tests, the server bundle is
# rebuilt, and a smoke test of the real app (sign in, Today, the four apps
# show content, Settings). A red run means: don't ship this.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Playwright supports Ubuntu 24.04; ubuntu-latest (26.04) is not supported yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Types
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx vitest run
        # Like Vercel's build, which has the database keys: tests must never use them.
        env:
          TURSO_URL: https://ci-not-a-real-db.turso.io
          TURSO_TOKEN: ci-fake
      - name: Server bundle is up to date (run npm run build:bot and commit it)
        run: npm run build:bot && git diff --exit-code --stat api/_bot/bot.mjs
      - name: Build the app
        run: npm run build:web
      - name: Smoke test (sign in, Today, apps, Settings)
        run: |
          npx playwright install --with-deps chromium
          node e2e/smoke.mjs
  windows-unit:
    # The desktop release builds on Windows. Run the unit tests there on every push too, so a
    # Windows-only failure shows up here in minutes instead of silently blocking every installer.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests on Windows
        run: npx vitest run
        env:
          TURSO_URL: https://ci-not-a-real-db.turso.io
          TURSO_TOKEN: ci-fake
