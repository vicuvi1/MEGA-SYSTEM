# Once a month, one grouped update for npm packages and one for GitHub
# Actions. CI (ci.yml) runs the tests and the smoke test on each one, so a
# broken update is visible before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Big upgrades are done by hand, with the desktop tested on Windows
      # (a quarterly task: docs/PLAN.md, "Keeping the platform supported").
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: sql.js
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
