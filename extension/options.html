<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Life System focus helper</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; }
      input { width: 100%; padding: 8px; font: inherit; margin: 8px 0; }
      button { padding: 8px 16px; font: inherit; }
    </style>
  </head>
  <body>
    <h2>Life System focus helper</h2>
    <p>Paste the code from Life System → Settings → Ben on this PC → "Set up the browser helper".</p>
    <input id="token" placeholder="The code" autocomplete="off" />
    <button id="save">Save</button>
    <p id="msg"></p>
    <script src="options.js"></script>
  </body>
</html>
