<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Life System: a level ring around a spark, on a deep squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#c8f135" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#c8f135" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c8f135" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fbf10"/>
      <stop offset="0.6" stop-color="#c8f135"/>
      <stop offset="1" stop-color="#ecff9a"/>
    </linearGradient>
    <linearGradient id="spark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f4ffc4"/>
      <stop offset="1" stop-color="#c8f135"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#shine)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <circle cx="256" cy="250" r="190" fill="url(#glow)"/>

  <!-- Track and progress ring (300 degrees), open at the top right -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="30"/>
  <path d="M 256 120 A 136 136 0 1 0 373.8 188" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="373.8" cy="188" r="21" fill="#ecff9a"/>

  <!-- Four-point spark -->
  <path d="M256 168 C 263 226 286 249 344 256 C 286 263 263 286 256 344 C 249 286 226 263 168 256 C 226 249 249 226 256 168 Z" fill="url(#spark)"/>
</svg>
